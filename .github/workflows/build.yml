name: Build Medication Reminder Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14

      - name: Install required libraries
        run: |
          arduino-cli lib install "ArduinoJson@6.21.3"

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=huge_app,PSRAM=opi \
            --output-dir ./build \
            ./medication_reminder/medication_reminder.ino
          ls -la ./build/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: medication-reminder-esp32s3
          path: |
            build/*.bin
          retention-days: 30
