name: Build ESP-BOX-3 Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Firmware
        run: pio run -e esp32s3box3

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: .pio/build/esp32s3box3/firmware.bin
          retention-days: 30

      - name: Upload Bootloader Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootloader-bin
          path: .pio/build/esp32s3box3/bootloader.bin
          retention-days: 30

      - name: Upload Partitions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: partitions-bin
          path: .pio/build/esp32s3box3/partitions.bin
          retention-days: 30
