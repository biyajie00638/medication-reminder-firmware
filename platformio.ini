[env:esp32s3box3]
platform = espressif32 @ 6.8.1
board = esp32s3box
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = default
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_ES8311=1
	-I"C:/Users/Administrator/.platformio/packages/toolchain-xtensa-esp32s3/xtensa-esp32s3-elf/include/c++/8.4.0"
	-I"C:/Users/Administrator/.platformio/packages/toolchain-xtensa-esp32s3/xtensa-esp32s3-elf/include/c++/8.4.0/xtensa-esp32s3-elf"
lib_deps = 
	bblanchon/ArduinoJson@^7.0.0
